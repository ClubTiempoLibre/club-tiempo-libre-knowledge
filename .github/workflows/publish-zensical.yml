name: Publicar documentación

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Zensical
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Zensical
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Compilar la documentación
        run: zensical build --clean --strict

      - name: Subir el sitio generado
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v5