name: Publicar documentación

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar DocFX
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Instalar DocFX
        run: dotnet tool install --global docfx --version 2.78.5

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Compilar la documentación
        run: docfx docfx.json

      - name: Subir el sitio generado
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v5